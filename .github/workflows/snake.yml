name: Generate Snake

on:
  schedule:
    # Tự động chạy mỗi 12 tiếng một lần
    - cron: "0 */12 * * *"
  
  # Cho phép bấm nút chạy thủ công bất cứ lúc nào
  workflow_dispatch:
  
  # Chạy mỗi khi bạn push code lên main
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate Snake Animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
