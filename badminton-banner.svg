<svg width="100%" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#0E1626" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <linearGradient id="lineGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes shuttleFlight {
      0% {
        transform: translate(110px, 145px) rotate(35deg);
      }
      20% {
        transform: translate(300px, 55px) rotate(10deg);
      }
      48% {
        transform: translate(770px, 140px) rotate(75deg);
      }
      50% {
        transform: translate(780px, 142px) rotate(-110deg);
      }
      72% {
        transform: translate(460px, 45px) rotate(-170deg);
      }
      98% {
        transform: translate(115px, 140px) rotate(-130deg);
      }
      100% {
        transform: translate(110px, 145px) rotate(35deg);
      }
    }

    @keyframes leftRacket {
      0%, 100% { transform: rotate(-15deg); transform-origin: 100px 175px; }
      5% { transform: rotate(25deg); transform-origin: 100px 175px; }
      15% { transform: rotate(0deg); transform-origin: 100px 175px; }
    }

    @keyframes rightRacket {
      45% { transform: rotate(15deg); transform-origin: 800px 175px; }
      52% { transform: rotate(-25deg); transform-origin: 800px 175px; }
      65% { transform: rotate(0deg); transform-origin: 800px 175px; }
    }

    @keyframes pulseNet {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.9; }
    }

    .shuttle-anim {
      animation: shuttleFlight 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .racket-left {
      animation: leftRacket 3s ease-in-out infinite;
    }
    .racket-right {
      animation: rightRacket 3s ease-in-out infinite;
    }
    .net-pulse {
      animation: pulseNet 2s ease-in-out infinite;
    }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      letter-spacing: 3px;
    }
    .subtitle-text {
      font-family: 'Fira Code', Consolas, Monaco, monospace;
      font-weight: 600;
      letter-spacing: 2px;
    }
  </style>

  <!-- Card Background -->
  <rect width="900" height="220" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Subtle Court Baseline -->
  <line x1="80" y1="185" x2="820" y2="185" stroke="url(#lineGlow)" stroke-width="2" stroke-dasharray="6 4" />
  
  <!-- Badminton Net in Center -->
  <g class="net-pulse">
    <line x1="450" y1="135" x2="450" y2="185" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
    <line x1="440" y1="140" x2="460" y2="140" stroke="#38BDF8" stroke-width="1.5" />
    <line x1="440" y1="150" x2="460" y2="150" stroke="#38BDF8" stroke-width="1.5" />
    <line x1="440" y1="160" x2="460" y2="160" stroke="#38BDF8" stroke-width="1.5" />
    <line x1="440" y1="170" x2="460" y2="170" stroke="#38BDF8" stroke-width="1.5" />
  </g>

  <!-- Trajectory Arc -->
  <path d="M 120 145 Q 310 40 450 65 T 780 140" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.35" />

  <!-- Left Racket -->
  <g class="racket-left">
    <line x1="80" y1="195" x2="105" y2="160" stroke="#64748B" stroke-width="3" stroke-linecap="round" />
    <ellipse cx="115" cy="146" rx="14" ry="18" fill="none" stroke="#38BDF8" stroke-width="2.5" transform="rotate(-30 115 146)" />
    <line x1="108" y1="135" x2="122" y2="157" stroke="#38BDF8" stroke-width="0.8" opacity="0.6" />
    <line x1="114" y1="132" x2="128" y2="154" stroke="#38BDF8" stroke-width="0.8" opacity="0.6" />
    <line x1="104" y1="148" x2="126" y2="140" stroke="#38BDF8" stroke-width="0.8" opacity="0.6" />
  </g>

  <!-- Right Racket -->
  <g class="racket-right">
    <line x1="820" y1="195" x2="795" y2="160" stroke="#64748B" stroke-width="3" stroke-linecap="round" />
    <ellipse cx="785" cy="146" rx="14" ry="18" fill="none" stroke="#818CF8" stroke-width="2.5" transform="rotate(30 785 146)" />
    <line x1="778" y1="135" x2="792" y2="157" stroke="#818CF8" stroke-width="0.8" opacity="0.6" />
    <line x1="772" y1="132" x2="786" y2="154" stroke="#818CF8" stroke-width="0.8" opacity="0.6" />
    <line x1="774" y1="140" x2="796" y2="148" stroke="#818CF8" stroke-width="0.8" opacity="0.6" />
  </g>

  <!-- Flying Shuttlecock -->
  <g class="shuttle-anim">
    <path d="M -12 -8 L -2 -1 L -12 6 Z" fill="#F8FAFC" opacity="0.95" />
    <path d="M -15 -6 L -3 0 L -15 6 Z" fill="#E2E8F0" opacity="0.8" />
    <line x1="-12" y1="-8" x2="-2" y2="-1" stroke="#94A3B8" stroke-width="0.8" />
    <line x1="-12" y1="6" x2="-2" y2="-1" stroke="#94A3B8" stroke-width="0.8" />
    <circle cx="2" cy="0" r="4.5" fill="#EF4444" />
    <circle cx="1" cy="-1" r="1.5" fill="#FCA5A5" />
  </g>

  <!-- Header Text -->
  <text x="450" y="80" text-anchor="middle" class="title-text" font-size="34" fill="#FFFFFF" filter="url(#glow)">
    LÊ TẤT KIÊN
  </text>
  
  <text x="450" y="112" text-anchor="middle" class="subtitle-text" font-size="13" fill="#38BDF8">
    🏸 BACKEND ENGINEER  •  .NET SPECIALIST  •  SMASHING BUGS ⚡
  </text>
</svg>
